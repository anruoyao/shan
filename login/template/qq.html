	var LOGIN_URL="<?php echo $pcbaseall;?>";

<body>
	<div>
		<center id="login"><img src="style/image/loading.gif">&nbsp;Login...</center>
		<center id="xTime">5</center>
	</div>
	<script type="text/javascript" src="//connect.qq.com/qc_jssdk.js" data-appid="<?php global $Appid;echo $Appid;?>" charset="utf-8"></script>
	<script type="text/javascript">
	var i="<?php echo $id;?>";
	var u="<?php echo $username;?>";
	var n="<?php echo $nickname;?>";
	if(u && n){
		var hash="<?php echo gpvar('hash');?>";
		login(i,'qq',n,'',hash,u);
	} else{
		var paras={};
		QC.api("get_user_info",paras)
			.success(function(s){
				var n=s.data.nickname;
				var h=s.data.figureurl_qq_2;
				if(!h){
					h=s.data.figureurl_qq_1;
				}
				if(QC.Login.check()){
					QC.Login.getMe(function(openId,accessToken){
						var u=openId;
						login(i,'qq',n,h,'',u);
					});
				}
			})
			.error(function(f){
				$id('login').innerHTML='(<span id="NextTime">2</span>) Sorry Login Fail...';
				NextTime('NextTime');
			})
			.complete(function(c){});
	}
	</script>
</body>
