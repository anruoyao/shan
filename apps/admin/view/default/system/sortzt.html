<script type="text/javascript">
function selectall() {
    var list = document.getElementsByName('list[]');
    var c = list[0].checked;
    for (var i = 0; i < list.length; i++) {
        if (c) {
            list[i].checked = '';
        } else {
            list[i].checked = 'checked';
        }
    }
}
</script>
