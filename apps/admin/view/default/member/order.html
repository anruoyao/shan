{include file='common/head.html'}
<div class="layui-body">
    <div class="layui-tab layui-tab-brief" lay-filter="tab">
        <ul class="layui-tab-title">
            <li class="layui-this" lay-id="t1"><a href="?p=/Member/order">订单管理</a></li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <form action="?p=/Member/order" method="post" class="layui-form so">
                    <input type="hidden" name="formcheck" value="{$formcheck}">
                    <input type="text" name="key" value="{$key}" placeholder="搜索会员名、订单号" class="layui-input">
                    <button class="layui-btn" lay-submit>搜索</button>
                </form>
                <div>{$tip}</div>
                <form action="?p=/Member/order" method="post" class="layui-form">
                    <input type="hidden" name="formcheck" value="{$formcheck}">
                    <table class="layui-table">
                        <thead>
                            <tr>
                                <th><input type="checkbox" lay-ignore="" id="checkall" title="全选"></th>
                                <th>ID</th>
                                <th>会员</th>
                                <th>订单号</th>
                                <th>付款金额</th>
                                <th>付款状态</th>
                                <th>付款方式</th>
                                <th>下单时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            {$list}
                        </tbody>
                    </table>
                    <div class="layui-btn-group">
                        <button type="button" onclick="selectall()" class="layui-btn layui-btn-sm">全选</button>
                        <button type="submit" name="submit" value="del" onclick="return del();" class="layui-btn layui-btn-sm">批量删除</button>
                    </div>
                </form>
                <div class="page">{$pagebar}</div>
            </div>
        </div>
    </div>
</div>
{include file='common/foot.html'}
<script type="text/javascript">
function del(tip) {
    if (tip != 1) {
        var list = document.getElementsByName('list[]');
        for (var i = 0; i < list.length; i++) {
            var c = list[i].checked;
            if (c) {
                break;
            }
        }
        if (!c) {
            alert('请选择要删除的项目！');
            return false;
        }
        tip = '确定要删除选中的项目吗？';
    } else {
        tip = '确定要删除这条内容吗？';
    }
    event.returnValue = confirm(tip);
}

function selectall() {
    var list = document.getElementsByName('list[]');
    var c = list[0].checked;
    for (var i = 0; i < list.length; i++) {
        if (c) {
            list[i].checked = '';
        } else {
            list[i].checked = 'checked';
        }
    }
}
</script>
