{include file='common/head.html'}
<div class="layui-body">
    <div class="layui-tab layui-tab-brief" lay-filter="tab">
        <ul class="layui-tab-title">
            <li lay-id="t1"><a href="?p=/Member/index">会员列表</a></li>
            <li lay-id="t2"><a href="?p=/Member/index#tab=t2">会员新增</a></li>
            <li class="layui-this" lay-id="t3"><a href="?p=/Member/author">作者管理</a></li>
            <li lay-id="t4"><a href="?p=/Member/tx">提现管理</a></li>
            <li lay-id="t5"><a href="?p=/Member/addnew">批量新增账号</a></li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                {if(![$uid])}
                <table class="layui-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>账号</th>
                            <th>昵称</th>
                            <th>状态</th>
                            <th>作者审核</th>
                            <th>签约作者</th>
                            <th>积分/金币</th>
                            <th>注册时间</th>
                            <th>最近登录</th>
                            <th>作品详情</th>
                        </tr>
                    </thead>
                    <tbody>
                        {$list}
                    </tbody>
                </table>
                <div class="page">{$pagebar}</div>
                {else}
                <table class="layui-table">
                    <thead>
                        <tr>
                            <th>日期（{$username}）</th>
                            <th>章节量</th>
                            <th>字数</th>
                        </tr>
                    </thead>
                    <tbody>
                        {$list}
                    </tbody>
                </table>
                {/if}
            </div>
        </div>
    </div>
</div>
{include file='common/foot.html'}
