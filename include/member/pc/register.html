            $bu2='&bu='.$bu;

                $bu2.='&w=wap';
            }
        }
        ?>
        <div class="box">

        <a href="<?php echo pbcode('member','service','fu');?>">《用户服务协议》</a>

        <a href="<?php echo pbcode('member','service','ys');?>">《隐私政策》</a>

<script type="text/javascript" src="{pboot:sitetplpath}/js/jquery-1.12.4.min.js"></script>
<script>
var x = $('#username');
if (x) {
    x.focus();
}

function reg(obj) {
    var ck=$id('deal').checked;
    if(!ck){
        alert('请阅读并勾选《用户服务协议》 和 《隐私政策》！');
        return false;
    }
    var url = '{pboot:register}';
    var username = $(obj).find("#username").val();
    var nickname = username;
    var password = $(obj).find("#password").val();
    var rpassword = $(obj).find("#rpassword").val();
    var checkcode = $(obj).find("#checkcode").val();
    var bu = '<?php echo $bu;?>';
    var wap = '<?php echo $w;?>';
    $.ajax({
        type: 'POST',
        url: url,
        dataType: 'json',
        data: {
            username: username,
            nickname: nickname,
            password: password,
            rpassword: rpassword,
            checkcode: checkcode,
            bu: bu,
            wap: wap
        },
        success: function(response, status) {
            if (response.code) {
                var url = response.tourl;
                x = '<div class="wait-box"><img src="include/member/image/loading.gif">注册成功~.~</div>';
                $id('logbox').innerHTML = x;
                top.location.href = url;
            } else {
                $('#codeimg').click();
                alert(response.data);
            }
        },
        error: function(xhr, status, error) {
            alert('返回数据异常！');
        }
    });
    return false;
}
</script>
