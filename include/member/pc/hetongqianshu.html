<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同签署系统 - 双向签署 & 三方合同</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5f7fb;
            color: #1a2332;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        a {
            color: #2b6cff;
            text-decoration: none;
            cursor: pointer;
        }
        a:hover {
            text-decoration: underline;
        }
        .container {
            width: 100%;
            max-width: 540px;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 32px 28px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.08);
            transition: box-shadow 0.25s;
        }
        .card:hover {
            box-shadow: 0 20px 56px rgba(0, 0, 0, 0.12);
        }
        .card-title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            color: #0b1a33;
        }
        .card-sub {
            text-align: center;
            color: #6b7a8f;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: #2d3a4f;
            margin-bottom: 5px;
        }
        .form-group .required {
            color: #e74c3c;
            margin-left: 2px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #fafbfc;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            color: #1a2332;
        }
        .form-control:focus {
            border-color: #2b6cff;
            box-shadow: 0 0 0 4px rgba(43, 108, 255, 0.12);

        }
        .form-control::placeholder {
            color: #a0b0c4;
        }
        .form-control-file {

        }
        .form-row {
            display: flex;

        }
        .form-row .form-group {
            flex: 1;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 13px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;

        }
        .btn-primary {
            background: #2b6cff;

        }
        .btn-primary:hover {
            background: #1a5ae0;
            transform: translateY(-1px);

        }
        .btn-primary:active {

        .btn-success {

        }

        }
        .btn-danger {

        }
        .btn-outline {

        }

        .btn-warning {

        }

        }

        }
        .btn-block {

        .admin-login-link {

        .msg.error {

        .msg.success {

        }
        .msg.info {

        .badge {

        }

        .spinner {

        .topbar {

        .topbar-user {

            font-size: 16px;
        }
        .topbar-actions {
            display: flex;

        }
        .topbar-actions .btn-sm {

        }
        .tabs {

        }
        .tabs .tab {

            font-size: 14px;
            font-weight: 500;
            color: #6b7a8f;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .tabs .tab:hover {

        }
        .tabs .tab.active {

            border-bottom-color: #2b6cff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .contract-item {
            background: #f8fafc;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 12px;
            border: 1px solid #edf2f7;
            transition: border 0.2s;
        }
        .contract-item:hover {
            border-color: #d0d7e3;
        }
        .contract-item .head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }
        .contract-item .title {
            font-weight: 600;
            font-size: 16px;
        }
        .contract-item .meta {
            font-size: 13px;

        }
        .contract-item .actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .contract-item .actions .btn-sm {
            padding: 5px 14px;

        }
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #8899b0;
            font-size: 15px;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));

        .admin-stats .stat {
            background: #f8fafc;

        .admin-stats .stat .num {

            color: #0b1a33;
        }
        .admin-stats .stat .label {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 2px;
        }
        .admin-table-wrap {
            overflow-x: auto;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .admin-table th {
            background: #f1f4f9;
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            color: #2d3a4f;
        }
        .admin-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }
        .admin-table tr:hover td {
            background: #fafbfc;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: #fff;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            padding: 32px 28px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);

        .modal .modal-title {

            font-weight: 700;
            margin-bottom: 18px;
        }
        .modal .modal-close {
            float: right;
            font-size: 24px;
            font-weight: 300;
            color: #8899b0;
            cursor: pointer;
            line-height: 1;
        }
        .modal .modal-close:hover {
            color: #1a2332;
        }
        .text-muted {
            color: #6b7a8f;
            font-size: 13px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .gap-8 {
            gap: 8px;
        }
        .text-center {
            text-align: center;
        }
        .w-full {
            width: 100%;
        }
        .contract-detail .field {
            margin-bottom: 10px;
        }
        .contract-detail .field .label {
            font-weight: 500;
            color: #2d3a4f;
            display: inline-block;

        }
        .contract-detail .field .value {

        }
        .signature-area {
            border: 2px dashed #d0d7e3;

            padding: 20px;
            text-align: center;

        }
        .signature-area .sig-placeholder {

            font-size: 28px;

        .signer-list {
            background: #f8fafc;
            border-radius: 10px;

        }
        .signer-item {
            display: flex;
            justify-content: space-between;

        }
        .signer-item:last-child {

        }
        .signer-item .badge {

        }
        .add-signer-btn {
            background: none;
            border: 1px dashed #2b6cff;

        }

            background: none;
            border: none;
            cursor: pointer;

        }
        .remove-signer-btn:hover {

        }
        .profile-field {
            margin-bottom: 16px;
        }
        .profile-field label {
            font-weight: 500;
            display: block;

            margin-bottom: 4px;
        }
        .profile-field .value {
            color: #1a2332;
            padding: 8px 0;
        }
        .profile-field .edit-input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="app" class="container"></div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ================================================================
        //  模拟数据库 (localStorage) 并支持数据迁移
        // ================================================================
        const DB = {
            getUsers() {
                return JSON.parse(localStorage.getItem('users') || '[]');
            },
            setUsers(users) {
                localStorage.setItem('users', JSON.stringify(users));
            },
            getContracts() {
                let contracts = JSON.parse(localStorage.getItem('contracts') || '[]');
                // 数据迁移：确保每个合同都有 signers 数组
                contracts = contracts.map(c => this.migrateContract(c));
                return contracts;
            },
            setContracts(contracts) {
                localStorage.setItem('contracts', JSON.stringify(contracts));
            },
            getNextId(key) {
                const id = parseInt(localStorage.getItem(key + '_id') || '0') + 1;
                localStorage.setItem(key + '_id', String(id));
                return id;
            },
            // 迁移旧合同数据到新结构
            migrateContract(c) {
                if (c.signers && Array.isArray(c.signers) && c.signers.length > 0) {
                    // 已有 signers，但可能缺少发起人，补充确保发起人存在
                    const creatorExists = c.signers.some(s => s.userId === c.creatorId);
                    if (!creatorExists && c.creatorId) {
                        const users = DB.getUsers();
                        const creator = users.find(u => u.id === c.creatorId);
                        c.signers.push({
                            userId: c.creatorId,
                            phone: creator ? creator.phone : '未知',
                            name: creator ? (creator.realName || creator.username) : c.creatorName || '发起人',
                            status: 'signed', // 发起人默认已签
                            signature: creator ? (creator.realName || creator.username) : c.creatorName || '发起人',
                            signedAt: c.createdAt || new Date().toISOString()
                        });
                    }
                    return c;
                }

                // 旧版合同：只有单个签署人字段
                const users = DB.getUsers();
                // 构建签署人列表
                const signers = [];
                // 1. 发起人
                const creator = users.find(u => u.id === c.creatorId);
                signers.push({
                    userId: c.creatorId,
                    phone: creator ? creator.phone : '未知',
                    name: creator ? (creator.realName || creator.username) : c.creatorName || '发起人',
                    status: 'signed', // 发起人视为已签
                    signature: creator ? (creator.realName || creator.username) : c.creatorName || '发起人',
                    signedAt: c.createdAt || new Date().toISOString()
                });

                // 2. 原签署人
                const signerUser = users.find(u => u.id === c.signerId);
                const signerStatus = c.status === 'signed' ? 'signed' : 'pending';
                signers.push({
                    userId: c.signerId,
                    phone: c.signerPhone || (signerUser ? signerUser.phone : '未知'),
                    name: c.signerName || (signerUser ? (signerUser.realName || signerUser.username) : '签署人'),
                    status: signerStatus,
                    signature: c.signature || '',
                    signedAt: c.signedAt || null
                });

                // 更新合同状态
                const allSigned = signers.every(s => s.status === 'signed');
                const newStatus = c.status === 'withdrawn' ? 'withdrawn' : (allSigned ? 'completed' : (signers.some(s => s
                    .status === 'signed') ? 'partial' : 'sent'));

                return {
                    ...c,
                    signers: signers,
                    status: newStatus,
                    updatedAt: c.updatedAt || c.createdAt || new Date().toISOString()
                };
            }
        };

        // 初始化管理员
        function initAdmin() {
            const users = DB.getUsers();
            if (!users.some(u => u.phone === 'admin')) {
                users.push({
                    id: DB.getNextId('users'),
                    username: 'admin',
                    phone: 'admin',
                    password: 'admin',
                    realName: '管理员',
                    role: 'admin',
                    verified: true,
                    orgName: '',
                    orgCode: '',
                    idCard: ''
                });
                DB.setUsers(users);
            }
        }
        initAdmin();

        // ================================================================
        //  工具函数
        // ================================================================
        function getToken() { return localStorage.getItem('token') || ''; }

        function setToken(t) { if (t) localStorage.setItem('token', t);
            else localStorage.removeItem('token'); }

        function getUser() {
            try { return JSON.parse(localStorage.getItem('user')); } catch { return null; }
        }

        function setUser(u) { if (u) localStorage.setItem('user', JSON.stringify(u));
            else localStorage.removeItem('user'); }

        function isLoggedIn() { return !!getToken() && !!getUser(); }

        function isAdmin() { const u = getUser(); return u && u.role === 'admin'; }

        function showMsg(msg, type = 'error') {
            const el = document.getElementById('globalMsg');
            if (!el) return;
            el.className = 'msg ' + type;
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function showModal(html) {
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ================================================================
        //  路由
        // ================================================================
        function getPageFromHash() {
            const hash = window.location.hash.slice(1);
            if (!hash) return 'login';
            return hash.split('?')[0];
        }

        function renderPage() {
            const page = getPageFromHash();
            if (isLoggedIn() && (page === 'login' || page === 'register' || page === 'org-register')) {
                window.location.hash = 'dashboard';
                return;
            }
            if (!isLoggedIn() && (page === 'dashboard' || page === 'admin')) {
                window.location.hash = 'login';
                return;
            }
            if (isLoggedIn() && isAdmin() && page !== 'admin' && page !== 'login') {
                window.location.hash = 'admin';
                return;
            }
            if (isLoggedIn() && !isAdmin() && page === 'admin') {
                window.location.hash = 'dashboard';
                return;
            }
            switch (page) {
                case 'login':
                    renderLogin();
                    break;
                case 'register':
                    renderRegister();
                    break;
                case 'org-register':
                    renderOrgRegister();
                    break;
                case 'dashboard':
                    renderDashboard();
                    break;
                case 'admin':
                    renderAdmin();
                    break;
                default:
                    renderLogin();
            }
        }
        window.addEventListener('hashchange', renderPage);
        window.addEventListener('load', renderPage);

        // ================================================================
        //  登录页面
        // ================================================================
        function renderLogin() {
            app.innerHTML = `
                <div class="card">
                    <div class="card-title">📄 合同签署</div>
                    <div class="card-sub">登录您的账户</div>
                    <div id="globalMsg" class="msg"></div>
                    <form id="loginForm">
                        <div class="form-group">
                            <label>手机号码 <span class="required">*</span></label>
                            <input type="tel" class="form-control" id="loginPhone" placeholder="请输入手机号" required>
                        </div>
                        <div class="form-group">
                            <label>密码 <span class="required">*</span></label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="请输入密码" required>
                        </div>
                        <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
                    </form>
                    <div class="footer-links">

        // ---------- 发起合同（支持多方） ----------
        function handleInitiate(e) {
            e.preventDefault();
            const user = getUser();
            const title = document.getElementById('contractTitle').value.trim();
            const signerInputs = document.querySelectorAll('.signer-phone');
            const signerPhones = [];
            signerInputs.forEach(inp => {
                const val = inp.value.trim();
                if (val) signerPhones.push(val);
            });
            if (!title || signerPhones.length === 0) { showMsg('请填写标题和至少一位签署人'); return; }
            const creatorSig = document.getElementById('creatorSignature').value.trim();
            if (!creatorSig) { showMsg('请输入您的签名'); return; }
            const file = document.getElementById('contractFile').files[0];
            if (!file) { showMsg('请上传合同文件'); return; }

            const users = DB.getUsers();
            const signers = [];
            const allPhones = [user.phone, ...signerPhones];
            if (new Set(allPhones).size !== allPhones.length) {
                showMsg('签署人不能包含自己且不能重复');
                return;
            }
            for (let phone of signerPhones) {
                const u = users.find(u => u.phone === phone);
                if (!u) { showMsg(`签署人 ${phone} 未注册`); return; }
                signers.push({
                    userId: u.id,
                    phone: u.phone,
                    name: u.realName || u.username,
                    status: 'pending',
                    signature: '',
                    signedAt: null
                });
            }

            // 发起人签署
            const creatorSignObj = {
                userId: user.id,
                phone: user.phone,
                name: user.realName || user.username,
                status: 'signed',
                signature: creatorSig,
                signedAt: new Date().toISOString()
            };
            const allSigners = [creatorSignObj, ...signers];

            const contract = {
                id: DB.getNextId('contracts'),
                title,
                creatorId: user.id,
                creatorName: user.realName || user.username,
                filePath: 'contract_' + Date.now() + '_' + file.name,
                signers: allSigners,
                status: 'sent', // 初始状态
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };
            // 自动更新状态
            const allSigned = allSigners.every(s => s.status === 'signed');
            contract.status = allSigned ? 'completed' : 'sent';
            const contracts = DB.getContracts();
            contracts.push(contract);
            DB.setContracts(contracts);
            showMsg('合同发起成功！', 'success');
            document.getElementById('initiateForm').reset();
            document.getElementById('signerListContainer').innerHTML = `
                <div class="signer-item" style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
                    <input type="tel" class="form-control signer-phone" placeholder="签署人手机号" style="flex:1;" required>
                    <button type="button" class="remove-signer-btn" style="display:none;">✕</button>
                </div>
            `;
            loadSentContracts();
            document.querySelector('#dashTabs .tab[data-tab="sent"]').click();
        }

        // ---------- 加载合同列表 ----------
        function loadSentContracts() {
            const container = document.getElementById('sentList');
            const contracts = DB.getContracts().filter(c => c.creatorId === getUser().id);
            renderContractList(container, contracts, 'sent');
        }

        function loadSignContracts() {
            const container = document.getElementById('signList');
            const user = getUser();
            const contracts = DB.getContracts().filter(c => {
                if (c.status === 'withdrawn') return false;
                const me = c.signers ? c.signers.find(s => s.userId === user.id) : null;
                return me && me.status === 'pending';
            });
            renderContractList(container, contracts, 'sign');
        }

        function loadSignedContracts() {
            const container = document.getElementById('signedList');
            const user = getUser();
            const contracts = DB.getContracts().filter(c => {
                if (c.status === 'withdrawn') return false;
                const me = c.signers ? c.signers.find(s => s.userId === user.id) : null;
                return me && me.status === 'signed';
            });
            renderContractList(container, contracts, 'signed');
        }

        function renderContractList(container, contracts, type) {
            if (!contracts || contracts.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 暂无合同</div>';
                return;
            }
            let html = '';
            contracts.forEach(c => {
                const statusMap = {
                    'sent': '待签署',
                    'partial': '部分签署',
                    'completed': '已完成',
                    'withdrawn': '已撤回'
                };
                const statusCls = {
                    'sent': 'badge-yellow',
                    'partial': 'badge-purple',
                    'completed': 'badge-green',
                    'withdrawn': 'badge-red'
                };
                const statusText = statusMap[c.status] || c.status;

                const signedCount = c.signers ? c.signers.filter(s => s.status === 'signed').length : 0;
                const total = c.signers ? c.signers.length : 0;
                const statusSummary = `${signedCount}/${total} 已签署`;

                let actionsHtml = '';
                if (type === 'sign' && c.status !== 'withdrawn') {
                    actionsHtml = `
                        <button class="btn btn-sm btn-success" onclick="window.signContract(${c.id})">✍️ 签署</button>
                        <button class="btn btn-sm btn-outline" onclick="window.viewContract(${c.id})">查看</button>
                    `;
                } else if (type === 'sent' && c.status !== 'withdrawn') {
                    actionsHtml = `
                        <button class="btn btn-sm btn-outline" onclick="window.viewContract(${c.id})">查看</button>
                        ${c.status === 'sent' || c.status === 'partial' ? `<button class="btn btn-sm btn-warning" onclick="window.withdrawContract(${c.id})">撤回</button>` : ''}
                        ${c.filePath ? `<a href="#" class="btn btn-sm btn-outline" onclick="alert('模拟下载：${c.filePath}')">📎 下载</a>` : ''}
                    `;
                } else {
                    actionsHtml = `
                        <button class="btn btn-sm btn-outline" onclick="window.viewContract(${c.id})">查看</button>
                        ${c.filePath ? `<a href="#" class="btn btn-sm btn-outline" onclick="alert('模拟下载：${c.filePath}')">📎 下载</a>` : ''}
                    `;
                }

                let signersHtml = '';
                if (c.signers && c.signers.length > 0) {
                    signersHtml = c.signers.map(s => {
                        const statusIcon = s.status === 'signed' ? '✅' : '⏳';
                        return `<span class="badge ${s.status === 'signed' ? 'badge-green' : 'badge-yellow'}">${s.name} ${statusIcon}</span>`;

                html += `

                                    ${c.createdAt ? ' &nbsp;|&nbsp; ' + new Date(c.createdAt).toLocaleString() : ''}

        // ---------- 签署合同 ----------
        window.signContract = function(contractId) {
            const contract = DB.getContracts().find(c => c.id === contractId);
            if (!contract) { showMsg('合同不存在'); return; }
            const user = getUser();
            if (!contract.signers) { showMsg('合同数据异常'); return; }
            const me = contract.signers.find(s => s.userId === user.id);
            if (!me || me.status === 'signed') { showMsg('您已签署或无权签署'); return; }

            showModal(`
                <div style="padding: 8px 0;">
                    <h3 style="margin-bottom: 12px;">✍️ 签署合同</h3>
                    <p style="color: #6b7a8f; margin-bottom: 16px;">合同标题：${contract.title}</p>
                    <div class="form-group">
                        <label>您的签名</label>
                        <input type="text" class="form-control" id="signatureInput" placeholder="输入您的签名" value="${user.realName || user.username}">
                    </div>
                    <div class="signature-area" id="signaturePreview">
                        <span class="sig-placeholder">预览签名</span>
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 16px;">
                        <button class="btn btn-success" id="confirmSignBtn" style="flex:1;">确认签署</button>
                        <button class="btn btn-outline" onclick="closeModal()" style="flex:1;">取消</button>
                    </div>
                </div>
            `);
            const input = document.getElementById('signatureInput');
            const preview = document.getElementById('signaturePreview');
            if (input && preview) {
                input.addEventListener('input', function() {
                    const val = this.value.trim();
                    preview.innerHTML = val ? `<span class="sig-text">${val}</span>` :
                        `<span class="sig-placeholder">预览签名</span>`;
                });
                input.dispatchEvent(new Event('input'));
            }
            document.getElementById('confirmSignBtn').addEventListener('click', function() {
                const signature = document.getElementById('signatureInput').value.trim();
                if (!signature) { showMsg('请输入签名'); return; }
                const contracts = DB.getContracts();
                const idx = contracts.findIndex(c => c.id === contractId);
                if (idx === -1) { showMsg('合同不存在'); return; }
                const c = contracts[idx];
                const signer = c.signers.find(s => s.userId === user.id);
                if (!signer || signer.status === 'signed') { showMsg('您已签署或无权签署'); return; }
                signer.status = 'signed';
                signer.signature = signature;
                signer.signedAt = new Date().toISOString();
                const allSigned = c.signers.every(s => s.status === 'signed');
                c.status = allSigned ? 'completed' : 'partial';
                c.updatedAt = new Date().toISOString();
                DB.setContracts(contracts);
                closeModal();
                showMsg('签署成功！', 'success');
                loadSignContracts();
                loadSignedContracts();
                loadSentContracts();
            });
        };

        // ---------- 撤回合同 ----------
        window.withdrawContract = function(contractId) {
            if (!confirm('确定要撤回该合同吗？撤回后不可恢复。')) return;
            const contracts = DB.getContracts();
            const idx = contracts.findIndex(c => c.id === contractId);
            if (idx === -1) { showMsg('合同不存在'); return; }
            const c = contracts[idx];
            if (c.status === 'completed') { showMsg('合同已完成，无法撤回'); return; }
            if (c.status === 'withdrawn') { showMsg('合同已撤回'); return; }
            c.status = 'withdrawn';
            c.updatedAt = new Date().toISOString();
            DB.setContracts(contracts);
            showMsg('合同已撤回', 'success');
            loadSentContracts();
            loadSignContracts();
            loadSignedContracts();
        };

        // ---------- 查看合同详情 ----------
        window.viewContract = function(contractId) {
            const contract = DB.getContracts().find(c => c.id === contractId);
            if (!contract) { showMsg('合同不存在'); return; }
            const statusMap = {
                'sent': '待签署',
                'partial': '部分签署',
                'completed': '已完成',
                'withdrawn': '已撤回'
            };
            const statusCls = {
                'sent': 'badge-yellow',
                'partial': 'badge-purple',
                'completed': 'badge-green',
                'withdrawn': 'badge-red'
            };

            let signersHtml = '';
            if (contract.signers && contract.signers.length > 0) {
                signersHtml = contract.signers.map(s => {
                    const statusText = s.status === 'signed' ? '✅ 已签署' : '⏳ 待签署';
                    return `<div class="signer-item"><span>${s.name} (${s.phone})</span> <span class="badge ${s.status === 'signed' ? 'badge-green' : 'badge-yellow'}">${statusText}</span></div>`;
                }).join('');
            } else {
                signersHtml = '<div class="text-muted">无签署人信息</div>';
            }

            let signatureHtml = '';
            if (contract.status === 'completed') {
                let sigs = contract.signers.filter(s => s.status === 'signed').map(s =>
                    `<div><strong>${s.name}</strong>: <span class="sig-text" style="font-size:24px;">${s.signature || '(未签名)'}</span> <span class="text-muted">${s.signedAt ? new Date(s.signedAt).toLocaleString() : ''}</span></div>`
                ).join('');
                signatureHtml = `<div class="signature-area" style="flex-direction:column; gap:8px;">${sigs || '无签名'}</div>`;
            } else if (contract.status === 'sent' || contract.status === 'partial') {
                signatureHtml = `<div class="signature-area"><span class="sig-placeholder">⏳ 等待所有签署人完成签署</span></div>`;
            } else {
                signatureHtml = `<div class="signature-area"><span class="sig-placeholder">合同已撤回</span></div>`;
            }

            showModal(`
                <div class="contract-detail">
                    <h3 style="margin-bottom: 12px;">📄 ${contract.title}</h3>
                    <div class="field"><span class="label">状态：</span><span class="badge ${statusCls[contract.status] || 'badge-gray'}">${statusMap[contract.status] || contract.status}</span></div>
                    <div class="field"><span class="label">发起人：</span><span class="value">${contract.creatorName || '未知'}</span></div>
                    <div class="field"><span class="label">创建时间：</span><span class="value">${contract.createdAt ? new Date(contract.createdAt).toLocaleString() : ''}</span></div>
                    <div class="field"><span class="label">合同文件：</span>${contract.filePath ? `<a href="#" class="btn btn-sm btn-outline" onclick="alert('模拟下载：${contract.filePath}')">📎 下载文件</a>` : '无'}</div>
                    <div style="margin-top: 16px;">
                        <div class="label" style="margin-bottom:6px;">签署人列表</div>
                        <div class="signer-list">${signersHtml}</div>
                    </div>
                    <div style="margin-top: 16px;">
                        <div class="label" style="margin-bottom:6px;">签署信息</div>
                        ${signatureHtml}
                    </div>
                    <div style="margin-top: 16px; text-align:right;">
                        <button class="btn btn-sm btn-outline" onclick="closeModal()">关闭</button>
                    </div>
                </div>
            `);
        };

        function handleAddUser(e) {
            e.preventDefault();
            const username = document.getElementById('addUsername').value.trim();
            const phone = document.getElementById('addPhone').value.trim();
            const password = document.getElementById('addPassword').value.trim();
            const realName = document.getElementById('addRealName').value.trim();
            const role = document.getElementById('addRole').value;
            const orgName = document.getElementById('addOrgName').value.trim();
            const verified = document.getElementById('addVerified').checked;
            if (!username || !phone || !password) { showMsg('请填写必填项'); return; }
            if (password.length < 6) { showMsg('密码至少6位'); return; }
            const users = DB.getUsers();
            if (users.some(u => u.phone === phone)) { showMsg('手机号已存在'); return; }
            users.push({
                id: DB.getNextId('users'),
                username,
                phone,
                password,
                realName: realName || username,
                role,
                verified,
                orgName: role === 'org' ? orgName : '',
                orgCode: '',
                idCard: ''
            });
            DB.setUsers(users);
            closeModal();
            showMsg('用户添加成功', 'success');
            loadAdminUsers();
            loadAdminStats();
        }

                showMsg('用户信息已更新', 'success');
                loadAdminUsers();
                loadAdminStats();
            });
        };

        window.deleteUser = function(userId) {
            if (!confirm('确定要删除该用户吗？')) return;
            let users = DB.getUsers();
            users = users.filter(u => u.id !== userId);
            DB.setUsers(users);
            showMsg('用户已删除', 'success');
            loadAdminUsers();
            loadAdminStats();
        };

        function loadOrgReview() {
            const container = document.getElementById('orgReviewList');
            const users = DB.getUsers().filter(u => u.role === 'org');
            if (users.length === 0) { container.innerHTML = '<div class="empty-state">暂无机构账号</div>'; return; }
            let html =
                `<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>机构名称</th><th>手机</th><th>信用代码</th><th>认证状态</th><th>操作</th></tr></thead><tbody>`;
            users.forEach(o => {
                html += `
                    <tr>
                        <td>${o.orgName || o.username}</td>
                        <td>${o.phone}</td>
                        <td>${o.orgCode || '-'}</td>
                        <td>${o.verified ? '✅ 已认证' : '❌ 未认证'}</td>
                        <td>
                            ${!o.verified ? `<button class="btn btn-sm btn-success" onclick="window.verifyOrg(${o.id})">认证</button>` : '<span class="text-muted">已认证</span>'}
                            ${o.orgLicense ? `<a href="#" class="btn btn-sm btn-outline" onclick="alert('模拟查看执照：${o.orgLicense}')">📎 执照</a>` : ''}
                        </td>
                    </tr>
                `;
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        window.verifyOrg = function(userId) {
            if (!confirm('确认认证该机构？')) return;
            const users = DB.getUsers();
            const user = users.find(u => u.id === userId);
            if (user) {
                user.verified = true;
                DB.setUsers(users);
                showMsg('机构已认证', 'success');
                loadOrgReview();
                loadAdminUsers();
            }
        };

        function handleChangeAdminPwd(e) {
            e.preventDefault();
            const oldPwd = document.getElementById('oldPwd').value.trim();
            const newPwd = document.getElementById('newPwd').value.trim();
            const confirmPwd = document.getElementById('confirmPwd').value.trim();
            if (!oldPwd || !newPwd || !confirmPwd) { showMsg('请填写完整'); return; }
            if (newPwd.length < 6) { showMsg('新密码至少6位'); return; }
            if (newPwd !== confirmPwd) { showMsg('两次密码输入不一致'); return; }
            const users = DB.getUsers();
            const admin = users.find(u => u.role === 'admin');
            if (!admin || admin.password !== oldPwd) { showMsg('当前密码错误'); return; }
            admin.password = newPwd;
            DB.setUsers(users);
            showMsg('密码修改成功', 'success');
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('confirmPwd').value = '';
        }

        // ================================================================
        //  确保所有全局函数已暴露
        // ================================================================
        window.viewContract = viewContract;
        window.signContract = signContract;
        window.withdrawContract = withdrawContract;
        window.editUser = editUser;
        window.deleteUser = deleteUser;
        window.verifyOrg = verifyOrg;
    </script>
</body>
</html>
