<script>
function delimg(){
    $id('ycico2').value='';
    $id('ycico').value='';
    $id('ycimg').src='';
}
function headpicx(x){
    var file=x.files[0];
    if(!file){
        return false;
    }
    if(!/image\/\w+/.test(file.type)){
        alert('请上传一张图片~');
        return false;
    }
    var reader=new FileReader();
    reader.readAsDataURL(file);
    reader.onload=function(){
        $id('headpicpath').value=x.value;
        $id('headpicimg').src=this.result;
    };
}
function umo(obj) {
    var nickname = $id('nickname').value;
    var idcard = $id('idcard').value;
    var xingming = $id('xingming').value;
    var usermobile = $id('usermobile').value;
    var yh_ka = $id('yh_ka').value;
    var yh_ming = $id('yh_ming').value;
    var yh_hang = $id('yh_hang').value;
    var wximg = $id('ycico2').value;
    nickname = trim(nickname);
    idcard = trim(idcard);
    xingming = trim(xingming);
    usermobile = trim(usermobile);
    yh_ka = trim(yh_ka);
    yh_ming = trim(yh_ming);
    yh_hang = trim(yh_hang);
    wximg = trim(wximg);
    if (!nickname) {
        $id('nickname').focus();
        alert('请输入笔名！');
        return false;
    }
    if (idcard && !/^(\d{15}|\d{17}[\dXx])$/.test(idcard)) {
        $id('idcard').focus();
        alert('身份证号格式不正确！');
        return false;
    }
    if (!xingming) {
        $id('xingming').focus();
        alert('请输入真实姓名！');
        return false;
    }
    if (usermobile) {
        var x = ckp(usermobile);
        if (!x) {
            $id('usermobile').focus();
            alert('请输入正确的手机号码！');
            return false;
        }
    }
    var yh = 0;
    if (yh_ka && yh_ming && yh_hang) {
        yh = 1;
    }
    if (!wximg && !yh) {
        alert('请选择其中一种收款方式！');
        return false;
    }
}
</script>
