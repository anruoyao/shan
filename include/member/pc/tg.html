                        <p class="desc___3-0Pr">
                            本届柠檬杯由山海书盟运营柠檬出资举办，获奖作者获得实体奖品1份。
<br>获奖作者：
<br>落子的余晖，代表作《人在戒网瘾学校，我看穿了所有人》
<br>西部风，代表作《断脉封圣》
<br>北齐千秋几度春，代表作《在历史的角落：不容青史尽成灰》
<br>许青山，代表作《我的三国从新野开始》
<br>星夜不朽，代表作《万道狂神》
