<script>
function umo(obj) {
    var nickname = $id('nickname').value;
    var useremail = $id('useremail').value;
    var usermobile = $id('usermobile').value;
    var password = $id('password').value;
    var rpassword = $id('rpassword').value;
    nickname = trim(nickname);
    useremail = trim(useremail);
    usermobile = trim(usermobile);
    password = trim(password);
    rpassword = trim(rpassword);
    if (!nickname) {
        $id('nickname').focus();
        alert('请输入昵称！');
        return false;
    }
    if (useremail) {
        var x = cke(useremail);
        if (!x) {
            $id('useremail').focus();
            alert('请输入正确的邮箱！');
            return false;
        }
    }
    if (usermobile) {
        var x = ckp(usermobile);
        if (!x) {
            $id('usermobile').focus();
            alert('请输入正确的手机号码！');
            return false;
        }
    }
    if (password || rpassword) {
        if (password != rpassword) {
            $id('password').focus();
            alert('两次密码输入不一致！');
            return false;
        }
    }
}
</script>
